name: Validate ROBOTY UI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check src/views-robots.js
      - run: node --check src/robot-types.js
      - run: node --test test/robot-appearance.test.mjs test/robot-orders-revision.test.mjs test/robot-rental-calendar.test.mjs
      - run: npm run build
