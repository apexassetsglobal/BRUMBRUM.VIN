name: Deploy ROBOTY I AUTOMATYKA
on:
  push:
    branches: [roboty-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roboty-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only roboty-app files
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            roboty-app
          sparse-checkout-cone-mode: true

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/roboty-site
          mkdir -p /tmp/roboty-site
          cp -a roboty-app/. /tmp/roboty-site/
          touch /tmp/roboty-site/.nojekyll

      - name: Publish to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf --sparse . || true
          cp -a /tmp/roboty-site/. .
          git add -A
          git commit -m "Deploy ROBOTY I AUTOMATYKA"
          git push --force origin gh-pages
